name: 🧪 CI / Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  linux-build:
    name: 🔨 Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install patch tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git patch

      - name: Normalize shell script permissions
        run: find . -type f -name '*.sh' -exec chmod +x {} +

      - name: Build and test
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash ./build/build.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yomiage-keiryou-linux-${{ matrix.arch }}
          path: build/dist/yomiage-keiryou-${{ matrix.arch }}
          if-no-files-found: error

  windows-wsl-build:
    name: 🪟 WSL / Linux compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install patch tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git patch

      - name: Normalize shell script permissions
        run: find . -type f -name '*.sh' -exec chmod +x {} +

      - name: Build ARM64 and AMD64 Linux binaries used by WSL
        run: |
          TARGET_ARCH=amd64 bash ./build/build.sh
          cp build/dist/yomiage-keiryou-amd64 windows/wsl/yomiage-keiryou-amd64
          TARGET_ARCH=arm64 bash ./build/build.sh
          cp build/dist/yomiage-keiryou-arm64 windows/wsl/yomiage-keiryou-arm64

      - name: Upload WSL examples
        uses: actions/upload-artifact@v4
        with:
          name: yomiage-keiryou-wsl-binaries
          path: |
            windows/wsl/yomiage-keiryou-amd64
            windows/wsl/yomiage-keiryou-arm64

  docker:
    name: 🐳 Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Login to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: windows/docker/Dockerfile
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
